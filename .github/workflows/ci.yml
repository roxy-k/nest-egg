name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect optional scripts
        run: |
          node - <<'NODE'
          const { writeFileSync } = require("node:fs");
          const { scripts = {} } = require("./package.json");
          const envPath = process.env.GITHUB_ENV;
          const lines = [
            `HAS_TEST_CLIENT=${scripts["test:client"] ? "true" : "false"}`,
            `HAS_LINT=${scripts.lint ? "true" : "false"}`
          ];
          writeFileSync(envPath, `${lines.join("\n")}\n`, { flag: "a" });
          NODE

      - name: Run server tests
        run: npm run test:server

      - name: Run client tests
        if: env.HAS_TEST_CLIENT == 'true'
        run: npm run test:client

      - name: Run lint
        if: env.HAS_LINT == 'true'
        run: npm run lint
